[package]
name = "cloud-sessions-core"
version = "0.2.1"
edition = "2021"
description = "Start, send into, read and watch Claude Code cloud sessions (no UI, no Tauri)."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
